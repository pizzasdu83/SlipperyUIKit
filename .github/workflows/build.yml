name: Storing the books

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check cache
        run: |
          echo upstream_heads=`git ls-remote https://github.com/theos/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: Randomblock1/theos-action@v1

      - name: Build package
        run: |
          rm -f packages/*
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Upload package (artifact, pour debug rapide)
        uses: actions/upload-artifact@v7
        with:
          name: "SlipperyUIKit .deb"
          path: ${{ github.workspace }}/packages/*.deb

      # Publie une release "vX.Y.Z" avec le .deb en asset : c'est CE fichier,
      # et lui seul, que SlipperyBar / SlipperyBatt téléchargeront pour
      # linker le framework. On ne le reconstruit jamais depuis un autre repo.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          TAG="v$VERSION"
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create "$TAG" packages/*.deb \
            --repo "${{ github.repository }}" \
            --title "SlipperyUIKit $VERSION" \
            --notes "Automated build"

